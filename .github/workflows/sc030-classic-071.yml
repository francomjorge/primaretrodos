name: PRISMA SC030-CLASSIC - restore original 071 DOS boot
on:
  push:
    branches: [sc030-classic-071]
    paths:
      - 'tools/restore_071_shell.py'
      - 'tools/attach_scumm004.py'
      - 'tools/menu_scale005.py'
      - 'tools/touch007.py'
      - 'tools/dirty_render008.py'
      - 'tools/gestures_timing009.py'
      - 'tools/reset_diag011.py'
      - 'tools/scroll_profile012.py'
      - 'tools/quiet_serial012.py'
      - 'tools/f5_save013.py'
      - 'tools/save_cards014.py'
      - 'tools/edge_scale015.py'
      - 'tools/outline_transition016.py'
      - 'tools/visual_lab017.py'
      - 'tools/hd_pixel019.py'
      - 'tools/live_lab020.py'
      - 'tools/mmpx022.py'
      - 'tools/native_scalers023.py'
      - 'tools/sd_library024.py'
      - 'tools/platform_library025.py'
      - 'tools/dos_runtime026.py'
      - 'tools/dos_folders027.py'
      - 'tools/dos_identity028.py'
      - 'tools/classic030.py'
      - 'tools/legacy_disk030.h'
      - 'tools/test_classic030.py'
      - 'tools/folder_disk027.h'
      - 'tools/prepare_freedos027.py'
      - 'tools/test_folder027.py'
      - 'third_party/mmpx/**'
      - 'tools/port_sc001.py'
      - '.github/workflows/sc030-classic-071.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch exact PRISMA Retro 071
        run: |
          git init retro
          git -C retro remote add origin https://github.com/francomjorge/ESP32P4.git
          git -C retro fetch --depth=1 origin c3c475e9e36d2f0e53bf3c92b47d416fcf2e9a28
          git -C retro checkout --detach FETCH_HEAD
          python tools/restore_071_shell.py retro/firmware/s3-4848-retro
      - name: Attach pinned native ScummVM
        run: |
          git init upstream
          git -C upstream remote add origin https://github.com/fcipaq/scummvm_esp32.git
          git -C upstream fetch --depth=1 origin c8053f4b606ec29ad7da2243b107e8941c9afd41
          git -C upstream checkout --detach FETCH_HEAD
          python tools/attach_scumm004.py retro/firmware/s3-4848-retro upstream
          python tools/menu_scale005.py retro/firmware/s3-4848-retro
          python tools/touch007.py retro/firmware/s3-4848-retro
          python tools/dirty_render008.py retro/firmware/s3-4848-retro
          python tools/gestures_timing009.py retro/firmware/s3-4848-retro
          python tools/reset_diag011.py retro/firmware/s3-4848-retro
          python tools/scroll_profile012.py retro/firmware/s3-4848-retro
          python tools/quiet_serial012.py retro/firmware/s3-4848-retro
          python tools/f5_save013.py retro/firmware/s3-4848-retro
          python tools/save_cards014.py retro/firmware/s3-4848-retro
          python tools/edge_scale015.py retro/firmware/s3-4848-retro
          python tools/outline_transition016.py retro/firmware/s3-4848-retro
          python tools/visual_lab017.py retro/firmware/s3-4848-retro
          python tools/hd_pixel019.py retro/firmware/s3-4848-retro
          python tools/live_lab020.py retro/firmware/s3-4848-retro
          python tools/mmpx022.py retro/firmware/s3-4848-retro
          python tools/native_scalers023.py retro/firmware/s3-4848-retro
          python tools/sd_library024.py retro/firmware/s3-4848-retro
          python tools/platform_library025.py retro/firmware/s3-4848-retro
          python tools/dos_runtime026.py retro/firmware/s3-4848-retro
          python tools/dos_folders027.py retro/firmware/s3-4848-retro
          python tools/dos_identity028.py retro/firmware/s3-4848-retro
          python tools/classic030.py retro/firmware/s3-4848-retro
      - name: Prepare internal FreeDOS and verify folder adapter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mtools
          python tools/test_folder027.py
          python tools/test_classic030.py
          curl -fL --retry 3 --max-time 120 https://www.ibiblio.org/pub/micro/pc-stuff/freedos/files/distributions/1.4/FD14-FloppyEdition.zip -o /tmp/freedos14.zip
          python tools/prepare_freedos027.py retro/firmware/s3-4848-retro /tmp/freedos14.zip
      - run: pip install platformio==6.1.18
      - run: |
          python -m venv /tmp/prisma-esp-venv
          /tmp/prisma-esp-venv/bin/pip install esptool==5.0.1 click==8.1.8
          /tmp/prisma-esp-venv/bin/python -I -m esptool version
      - name: Install same Arduino platform as 071
        working-directory: retro/firmware/s3-4848-retro
        run: |
          pio pkg install -e esp32-4848s040
          python - <<'PY'
          from pathlib import Path
          wrapper=Path("/tmp/prisma-esptool")
          wrapper.write_text('#!/bin/sh\nexec /tmp/prisma-esp-venv/bin/python -I -m esptool "$@"\n')
          wrapper.chmod(0o755)
          for p in (Path.home()/".platformio/platforms").glob("espressif32*/builder/main.py"):
              s=p.read_text()
              old="esptool_binary_path = install_esptool()"
              assert old in s,p
              p.write_text(s.replace(old,'esptool_binary_path = "/tmp/prisma-esptool"'))
          PY
          python tools/patch_gfx.py
          bash tools/sc026-patch-dos.sh
      - name: Compile both native engines
        working-directory: retro/firmware/s3-4848-retro
        run: pio run -e esp32-4848s040
      - name: Package and verify 16 MiB raw image
        working-directory: retro/firmware/s3-4848-retro
        run: |
          set -eux
          B=.pio/build/esp32-4848s040
          mkdir -p dist
          /tmp/prisma-esp-venv/bin/python -I -m esptool --chip esp32s3 merge-bin --flash-size 16MB --flash-mode dio --flash-freq 40m -o dist/PRISMA-SC030-CLASSIC-factory-16MB.bin 0x0 "$B/bootloader.bin" 0x8000 "$B/partitions.bin" 0x10000 "$B/firmware.bin"
          cp "$B/firmware.bin" dist/PRISMA-SC030-CLASSIC-app.bin
          python - <<'PY'
          from pathlib import Path
          p=Path("dist/PRISMA-SC030-CLASSIC-factory-16MB.bin")
          data=p.read_bytes()
          assert data[0]==0xe9 and data[2]==2 and data[3]==0x40,data[:4].hex()
          assert data[0x8000:0x8002]==b"\xaa\x50"
          assert data[0x10000]==0xe9
          assert len(data)<=0x510000
          p.write_bytes(data+b"\xff"*(0x1000000-len(data)))
          assert p.stat().st_size==16777216
          PY
          python - <<'PY'
          from pathlib import Path
          import os,hashlib
          app=Path("dist/PRISMA-SC030-CLASSIC-app.bin").read_bytes()
          sha=os.environ["GITHUB_SHA"][:8]
          stamp=("SC030-CLASSIC / "+sha).encode()
          assert stamp in app,stamp
          assert b"SC030 CLASSIC 071 VM READY" in app
          assert b"PRDOS032 / MOTOR 071" in app
          assert b"DOS TOUCH LAUNCHER" in app
          assert b"DESCOMPRIMIR ZIP" in app
          assert b"MOTOR DOS PENDIENTE" not in app
          assert len(app)<=0x500000
          Path("dist/BUILD-IDENTITY.txt").write_text("SC030-CLASSIC / "+sha+"\nApp SHA256 "+hashlib.sha256(app).hexdigest()+"\nFlash app only at 0x10000; preserve existing partitions and games.\nFactory is blank of private games.\n")
          print("Verified binary identity",stamp,len(app))
          PY
          (cd dist && sha256sum *.bin > SHA256SUMS.txt)
          tar -czf dist/SC030-CLASSIC-corresponding-source.tar.gz src platformio.ini partitions_scumm.csv tools/sc026-patch-dos.sh tools/freedos027-origin.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PRISMA-SC030-CLASSIC-dos-folders
          path: retro/firmware/s3-4848-retro/dist/
          if-no-files-found: error
      - name: Publish verified direct application BIN
        working-directory: retro/firmware/s3-4848-retro
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          cd dist
          sha256sum -c SHA256SUMS.txt
          tag="SC030-CLASSIC-${GITHUB_SHA:0:8}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "PRISMA $tag" --notes "Application only: 0x10000. Original 071 DOS runtime reads user-owned old full BIN or PRDOS032 disk in XT on SD. Private DOS disks and games not included. Hardware validation pending." PRISMA-SC030-CLASSIC-app.bin BUILD-IDENTITY.txt SHA256SUMS.txt SC030-CLASSIC-corresponding-source.tar.gz

