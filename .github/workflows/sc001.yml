name: PRISMA SCUMM SC001
on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.2.1
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned upstream
        shell: bash
        run: |
          git init upstream
          git -C upstream remote add origin https://github.com/fcipaq/scummvm_esp32.git
          git -C upstream fetch --depth=1 origin c8053f4b606ec29ad7da2243b107e8941c9afd41
          git -C upstream checkout --detach FETCH_HEAD
      - name: Apply board port
        run: python3 tools/port_sc001.py upstream
      - name: Compile
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd upstream
          idf.py build
      - name: Package firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          mkdir -p dist
          cd upstream/build
          python -m esptool --chip esp32s3 merge_bin --flash_mode dio --flash_freq 40m --flash_size 16MB --fill-flash-size 16MB -o ../../dist/PRISMA-SC001-factory-16MB.bin 0x0 bootloader/bootloader.bin 0x8000 partition_table/partition-table.bin 0x10000 scumm-go.bin
          cp scumm-go.bin ../../dist/PRISMA-SC001-app.bin
          cp scumm-go.elf ../../dist/
          test "$(wc -c < ../../dist/PRISMA-SC001-factory-16MB.bin)" -eq 16777216
          cd ../..
          (cd dist && sha256sum *.bin > SHA256SUMS.txt)
          tar -czf dist/SC001-corresponding-source.tar.gz --exclude=upstream/.git --exclude=upstream/build upstream tools
      - uses: actions/upload-artifact@v4
        with:
          name: PRISMA-SC001
          path: dist/
          if-no-files-found: error
